# Retrait du SECOND producteur de la publication vers le Vault (2026-09-06).
#
# L unite de base porte encore :
#   ExecStartPost=/usr/bin/rclone ... copy "convia:Traité" "convia-rag:ConvIA" ...
# C etait le chemin historique : une conversation n arrivait au RAG qu APRES la
# meta-analyse Gemini. Depuis convia-sanitize.service.d/20-publication-rag.conf,
# la publication appartient au transport et couvre DEJA les deux sources
# (`convia:` et `convia:Traité`).
#
# Laisser les deux en place, c est deux producteurs pour un meme etat : le jour
# ou Gemini est desactive, plus personne ne saurait lequel alimentait vraiment le
# RAG. On neutralise donc celui de l analyse. `ExecStartPost=` seul reinitialise
# la liste heritee ; l unite de base n est pas modifiee, ce qui rend le retour en
# arriere trivial (supprimer ce fichier + `systemctl daemon-reload`).
[Service]
ExecStartPost=
