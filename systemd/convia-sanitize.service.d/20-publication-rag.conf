# Publication vers le Vault, DECOUPLEE de l analyse.
#
# Constat de l audit du 2026-09-06 : la seule chose qui versait les conversations
# dans « Obsidian Vault/raw/assets/ConvIA » etait l ExecStartPost de
# convia-analyse.service. Une conversation n arrivait donc au RAG qu APRES etre
# passee par la meta-analyse Gemini -- mesure faite : 25,8 h de retard median.
# Pire, neutraliser Gemini (l objectif) aurait coupe l alimentation du RAG.
#
# La publication appartient au transport, pas a l analyse. Elle est donc rattachee
# ici, apres la sanitization de niveau A : une conversation est publiable des qu elle
# est assainie, quel que soit son sort analytique.
#
# `copy` et non `sync` : le Drive « Conv IA » est une file de travail ou l analyse
# DEPLACE les fichiers vers Traite/. Un `sync` effacerait du Vault tout ce qui a
# ete deplace entre deux passages.
[Service]
ExecStartPost=/usr/bin/rclone --config /var/lib/convia/rclone.conf copy "convia:" "convia-rag:ConvIA" --exclude ".raw/**" --exclude "Traité/**" --exclude "traiter/**" --transfers 4 --checkers 8 --stats 0
ExecStartPost=/usr/bin/rclone --config /var/lib/convia/rclone.conf copy "convia:Traité" "convia-rag:ConvIA" --transfers 4 --checkers 8 --stats 0
