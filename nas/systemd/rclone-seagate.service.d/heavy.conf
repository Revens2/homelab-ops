[Service]
# 15/09 : Drive autorisé malgré la pause heavy-io (choix user)
Environment=NAS_HEAVY_FORCE=1
ExecStart=
ExecStart=/usr/local/sbin/nas-heavy rclone-drive /usr/bin/rclone copy /srv/storage/ --exclude "/Rapide/**" --exclude "/Non-sauvegarde/**" --bwlimit 4M --exclude "/lost+found/**" "gdrive:${DRIVE_FOLDER}/" --transfers 4 --checkers 4 --drive-chunk-size 64M --max-transfer 700G --cutoff-mode=soft --retries 5 --low-level-retries 20 --stats 15m --stats-one-line --log-level INFO --log-file /home/nasowner/rclone-seagate.log --exclude "/Flight Simulator/**" --exclude "/Vidéos/DaVinci/CacheClip/**" --tpslimit 8
